; CrowPanel 1.28" HMI ESP32-S3 Rotary Display
;
; Pinned deliberately: Elecrow's examples and the CST816D/LovyanGFX glue are
; written against Arduino-ESP32 2.0.14 and LVGL 8.3.x. LVGL 9 is a breaking API
; change -- do not bump it without porting the UI.

[env:crowpanel128]
platform = espressif32@6.5.0          ; -> Arduino-ESP32 core 2.0.14
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
# DIO, not QIO. This is what the toolchain actually stamps into the bootloader
# header; flashing with `--flash-mode qio` rewrites that byte and the ROM then
# reads flash in the wrong mode -> TG0WDT_SYS_RST boot loop with no app output.
board_build.flash_mode = dio
board_upload.flash_size = 16MB
# ESP32-S3R8: 8MB *octal* PSRAM. The esp32-s3-devkitc-1 board definition
# defaults to qio_qspi, under which the PSRAM never initialises and every
# heap_caps_malloc(MALLOC_CAP_SPIRAM) returns null.
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    ; Use the hardware USB-Serial/JTAG peripheral rather than TinyUSB. Both give
    ; a CDC port that Web Serial (and therefore Improv) can open, but only this
    ; one keeps esptool's auto-reset working: with TinyUSB the app takes over
    ; USB, the port re-enumerates, and every reflash needs a manual BOOT+RESET.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1       ; Serial == that CDC port
    -DFW_VERSION='"0.1.0"'
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include

lib_deps =
    lvgl/lvgl@8.3.11
    lovyan03/LovyanGFX@^1.1.12
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit NeoPixel@^1.12.0

; Renders a baked-in payload with no Wi-Fi, so UI work is a 20-second flash
; cycle instead of a network round trip.
[env:crowpanel128-demo]
extends = env:crowpanel128
build_flags = ${env:crowpanel128.build_flags} -DDEMO_MODE=1

; Backlight bring-up only: blinks GPIO46 forever, nothing else initialised.
[env:crowpanel128-diag]
extends = env:crowpanel128
build_flags = ${env:crowpanel128.build_flags} -DDIAG_BACKLIGHT=1
