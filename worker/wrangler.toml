name = "rotary-stats"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Keep the workers.dev subdomain alive alongside the custom domain: it is a
# useful fallback and lets the device be pointed somewhere while DNS settles.
workers_dev = true

# Custom domain. Wrangler creates the DNS record and cert on deploy, provided
# the imcb.dev zone is in this Cloudflare account.
routes = [
  { pattern = "hdog.imcb.dev", custom_domain = true },
]

# Static config UI. run_worker_first so /api/* is always handled by our router;
# anything the router does not claim is forwarded to ASSETS explicitly.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true

# KV keeps the GitHub snapshot and firmware images: read constantly, written
# rarely. That is what KV is for.
[[kv_namespaces]]
binding = "DEVICES"
id = "8fd735bcb0a44f79bf3d73b6befd71ea"

# D1 holds device state -- config, auth, status, logs. Small records written
# often, and strongly consistent, so a pushed setting is visible immediately
# instead of after KV's 15-30s read lag.
[[d1_databases]]
binding = "DB"
database_name = "rotary-stats"
database_id = "f53e063d-75a4-46c5-ac62-c786956ca102"

# Refresh GitHub data on a fixed schedule so device polls always hit warm cache
# and the GitHub rate limit is bounded regardless of how many devices exist.
[triggers]
crons = ["*/5 * * * *"]

[vars]
DEFAULT_LOGIN = "PlasticRocket"

# Secrets (set with `wrangler secret put`):
#   GH_TOKEN  - fine-grained read-only public-repo PAT (the default token)
#   ENC_KEY   - base64 32-byte AES-GCM key for encrypting user-supplied PATs
