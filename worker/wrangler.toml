name = "rotary-stats"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Custom domain. Wrangler creates the DNS record and cert on deploy, provided
# the imcb.dev zone is in this Cloudflare account.
routes = [
  { pattern = "hdog.imcb.dev", custom_domain = true },
]

# Static config UI. run_worker_first so /api/* is always handled by our router;
# anything the router does not claim is forwarded to ASSETS explicitly.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "DEVICES"
id = "PLACEHOLDER_REPLACE_AFTER_KV_CREATE"

# Refresh GitHub data on a fixed schedule so device polls always hit warm cache
# and the GitHub rate limit is bounded regardless of how many devices exist.
[triggers]
crons = ["*/5 * * * *"]

[vars]
DEFAULT_LOGIN = "PlasticRocket"

# Secrets (set with `wrangler secret put`):
#   GH_TOKEN  - fine-grained read-only public-repo PAT (the default token)
#   ENC_KEY   - base64 32-byte AES-GCM key for encrypting user-supplied PATs
