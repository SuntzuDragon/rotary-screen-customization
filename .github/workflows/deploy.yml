name: Deploy worker

# The Worker serves web/dist as its static assets, so the UI has to be built
# before the deploy step -- a worker-only change still needs those assets
# present in the upload.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Typecheck both halves before anything reaches production. The device
      # payload shape is duplicated between worker and web, so a break here is
      # exactly the kind of thing that would otherwise ship silently.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build UI
        run: pnpm --filter rotary-stats-web build

      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://rotary-stats.imcb01.workers.dev/api/health)
            echo "health attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          echo "worker did not come back healthy after deploy"
          exit 1
