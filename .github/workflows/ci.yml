name: CI

# Committing to main *is* deploying, so every check that can run before a merge
# runs here rather than in deploy.yml. Each check is its own job: they run in
# parallel, and a red cross names the thing that actually broke instead of
# reporting "CI failed" from somewhere inside a multi-step script. Install is
# cheap once the pnpm store is cached, so the duplicated setup costs little.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fix locally with `pnpm format`.
      - run: pnpm format:check

  typecheck:
    name: Typecheck (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      # Both packages report independently: the device payload shape is
      # duplicated between them, so knowing which half broke is the point.
      fail-fast: false
      matrix:
        package: [web, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./${{ matrix.package }} typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter rotary-stats-web build

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --audit-level=high on purpose: including low and moderate surfaces
      # routine transitive noise and makes this flaky for pull requests that
      # did not cause it.
      - run: pnpm audit --audit-level=high

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: firmware/requirements.txt

      # Restore-only, deliberately. Actions caches are scoped per ref and share
      # a 10GB quota evicted least-recently-used, so a cache *written* by every
      # pull request would compete with the warm one on main that firmware.yml
      # depends on to keep tag builds at ~87s instead of ~230s. Reading main's
      # cache costs nothing and evicts nothing.
      - name: Restore PlatformIO cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            firmware/.pio/cache
          key: pio-${{ hashFiles('firmware/platformio.ini', 'firmware/include/lv_conf.h') }}-
          restore-keys: |
            pio-${{ hashFiles('firmware/platformio.ini', 'firmware/include/lv_conf.h') }}-
            pio-

      - name: Install toolchain
        run: pip install --quiet -r firmware/requirements.txt

      # fw_version.h is gitignored-adjacent: CI stamps it at publish time, so a
      # plain compile check needs whatever is committed to be buildable as-is.
      - name: Build
        working-directory: firmware
        run: pio run -e crowpanel128

# A Lint job is intentionally absent: no ESLint config exists yet (#24). It
# slots in once that lands — a job that fails on every pull request from day
# one is worse than no job.
