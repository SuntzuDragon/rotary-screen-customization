name: Publish firmware

# Firmware is flashed over USB from the settings page, not over the air, so this
# job's only output is a merged image plus metadata in KV for esp-web-tools to
# fetch. Tag a release to publish: git tag v0.2.0 && git push --tags
on:
  push:
    tags: ['v*']
    # Also build (without publishing) on main. Actions caches are scoped per
    # ref, and every tag is its own ref -- so tag-only builds could never reuse
    # each other's cache and were cold every single time, at ~1.1GB of quota
    # apiece. Runs *can* read the default branch's cache, so keeping a warm one
    # on main is what makes the cache work at all. It doubles as a compile check
    # on every firmware change instead of finding breakage at release time.
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label to publish as'
        required: true
        default: 'dev'

# Serialised per ref, but a tag run is never cancelled: the publish step writes
# the image to KV and then the index row to D1, and killing it between the two
# would leave a blob with no row pointing at it. Superseded compile checks on
# main are fine to cancel.
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: firmware/requirements.txt

      # The key includes the run id so the cache is *written* every run, with
      # restore-keys pulling in the previous one. A fixed key only ever saves
      # once, so the cache goes stale immediately and every build is cold --
      # which is what was happening: ~3 minutes of recompiling the Arduino
      # framework and LVGL, neither of which changes between runs.
      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            firmware/.pio/cache
          key: pio-${{ hashFiles('firmware/platformio.ini', 'firmware/include/lv_conf.h') }}-${{ github.run_id }}
          restore-keys: |
            pio-${{ hashFiles('firmware/platformio.ini', 'firmware/include/lv_conf.h') }}-
            pio-

      - name: Install toolchain
        run: pip install --quiet -r firmware/requirements.txt

      # The version reaches a shell, a C header and a SQL statement, so it is
      # validated once here rather than escaped three times downstream. Inputs
      # go through env: -- a ${{ }} expression inside run: is spliced in as
      # source text before the shell ever sees it.
      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version || 'dev' }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VALUE="${GITHUB_REF_NAME#v}"
          else
            VALUE="$INPUT_VERSION"
          fi
          case "$VALUE" in
            [A-Za-z0-9]*) ;;
            *) echo "refusing version '$VALUE': must start with a letter or digit"; exit 1 ;;
          esac
          case "$VALUE" in
            *[!A-Za-z0-9._-]*)
              echo "refusing version '$VALUE': letters, digits, dot, dash, underscore only"
              exit 1 ;;
          esac
          if [ "${#VALUE}" -gt 32 ]; then echo "version too long"; exit 1; fi
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

      # Only tags and explicit dispatches publish. A push to main just builds,
      # to validate the change and leave a warm cache behind.
      - name: Decide whether to publish
        id: gate
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # The version is a generated header rather than a CLI flag: `pio run` has
      # no --project-option, and a header keeps local and CI builds identical.
      - name: Stamp version
        working-directory: firmware
        env:
          VERSION: ${{ steps.ver.outputs.value }}
        run: |
          printf '#pragma once\n#define FW_VERSION "%s"\n' "$VERSION" > include/fw_version.h
          cat include/fw_version.h

      - name: Build
        working-directory: firmware
        run: pio run -e crowpanel128

      # One merged image from 0x0 means the browser flasher needs a single part
      # and no partition offset arithmetic.
      - name: Merge image
        if: steps.gate.outputs.publish == 'true'
        working-directory: firmware/.pio/build/crowpanel128
        run: |
          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          esptool --chip esp32s3 merge-bin -o merged.bin \
            --flash-mode dio --flash-freq 80m --flash-size 16MB \
            0x0 bootloader.bin \
            0x8000 partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 firmware.bin
          ls -l merged.bin

      # Only the publish path needs node: the compile check that runs on every
      # push to main does not touch the worker at all.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.gate.outputs.publish == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.publish == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The image goes to KV (a 1.4MB blob is the wrong shape for a SQL row);
      # its metadata goes to D1, which is the index of record. Order matters:
      # write the blob first, so a version can never be advertised in the
      # dropdown before it can actually be downloaded.
      - name: Publish to the Worker
        if: steps.gate.outputs.publish == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION: ${{ steps.ver.outputs.value }}
        run: |
          set -euo pipefail
          BIN=../firmware/.pio/build/crowpanel128/merged.bin
          SHA=$(sha256sum "$BIN" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$BIN")
          NOW=$(date +%s)
          pnpm install --frozen-lockfile

          pnpm exec wrangler kv key put "fw:bin:$VERSION" --binding DEVICES --remote --path "$BIN"

          # Wait until the image is actually downloadable before advertising it.
          #
          # A successful KV put only means the write was accepted; it can take
          # up to a minute to be readable from every edge. The D1 row is
          # instant, so without this the dropdown could offer a version whose
          # download 404s. (That fails safe -- the flash never starts -- but it
          # looks broken.)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://hdog.imcb.dev/api/firmware/merged.bin?v=$VERSION" || true)
            echo "  image readable check $i: HTTP $code"
            [ "$code" = "200" ] && break
            if [ "$i" = "30" ]; then
              echo "image never became readable; not publishing the index row"
              exit 1
            fi
            sleep 5
          done

          pnpm exec wrangler d1 execute rotary-stats --remote --command "
            INSERT INTO firmware (version, sha256, size, source, uploaded_at, owner)
            VALUES ('$VERSION', '$SHA', $SIZE, 'ci', $NOW, NULL)
            ON CONFLICT(version) DO UPDATE SET sha256=excluded.sha256, size=excluded.size,
                                               source=excluded.source,
                                               uploaded_at=excluded.uploaded_at,
                                               owner=NULL;
            INSERT INTO meta (key, value) VALUES ('fw_latest', '$VERSION')
            ON CONFLICT(key) DO UPDATE SET value=excluded.value;
          "
          echo "published $VERSION ($SIZE bytes, $SHA)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.gate.outputs.publish == 'true'
        with:
          name: firmware-${{ steps.ver.outputs.value }}
          path: firmware/.pio/build/crowpanel128/merged.bin
