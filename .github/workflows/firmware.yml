name: Publish firmware

# Firmware is flashed over USB from the settings page, not over the air, so this
# job's only output is a merged image plus metadata in KV for esp-web-tools to
# fetch. Tag a release to publish: git tag v0.2.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label to publish as'
        required: true
        default: 'dev'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install toolchain
        run: pip install --quiet platformio esptool

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # The version is a generated header rather than a CLI flag: `pio run` has
      # no --project-option, and a header keeps local and CI builds identical.
      - name: Stamp version
        working-directory: firmware
        run: |
          printf '#pragma once\n#define FW_VERSION "%s"\n' "${{ steps.ver.outputs.value }}" \
            > include/fw_version.h
          cat include/fw_version.h

      - name: Build
        working-directory: firmware
        run: pio run -e crowpanel128

      # One merged image from 0x0 means the browser flasher needs a single part
      # and no partition offset arithmetic.
      - name: Merge image
        working-directory: firmware/.pio/build/crowpanel128
        run: |
          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          esptool --chip esp32s3 merge-bin -o merged.bin \
            --flash-mode dio --flash-freq 80m --flash-size 16MB \
            0x0 bootloader.bin \
            0x8000 partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 firmware.bin
          ls -l merged.bin

      # Images are keyed by version and listed in fw:index, so the settings page
      # can offer every published build (and roll back to one). The index is a
      # read-modify-write here rather than a Worker endpoint, which keeps CI on
      # the CLOUDFLARE_API_TOKEN that already exists -- no extra secret.
      - name: Publish to the Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION: ${{ steps.ver.outputs.value }}
        run: |
          set -euo pipefail
          BIN=../firmware/.pio/build/crowpanel128/merged.bin
          SHA=$(sha256sum "$BIN" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$BIN")
          npm ci

          npx wrangler kv key put "fw:bin:$VERSION" --binding DEVICES --remote --path "$BIN"

          npx wrangler kv key get fw:index --binding DEVICES --remote > old-index.json 2>/dev/null \
            || echo '{"latest":"","versions":[]}' > old-index.json
          [ -s old-index.json ] || echo '{"latest":"","versions":[]}' > old-index.json

          jq -n \
            --arg v "$VERSION" --arg sha "$SHA" --argjson size "$SIZE" \
            --argjson now "$(date +%s)" --slurpfile old old-index.json '
              ($old[0] // {latest:"", versions:[]}) as $o
              | {version:$v, sha256:$sha, size:$size, source:"ci", uploadedAt:$now} as $new
              | {latest: $v,
                 versions: ([$new] + [$o.versions[]? | select(.version != $v)])[0:10]}
            ' > new-index.json

          npx wrangler kv key put fw:index --binding DEVICES --remote --path new-index.json
          echo "published $VERSION ($SIZE bytes, $SHA)"
          jq -r '.versions[] | "  kept \(.version)"' new-index.json

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ steps.ver.outputs.value }}
          path: firmware/.pio/build/crowpanel128/merged.bin
